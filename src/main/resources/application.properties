spring.application.name=student-task-manager

spring.datasource.url=jdbc:postgresql://localhost:5432/student_task_db
spring.datasource.username=postgres
spring.datasource.password=${DB_PASSWORD}
spring.datasource.driver-class-name=org.postgresql.Driver


spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true
spring.jpa.open-in-view=false

app.jwt.secret=change-this-development-secret-key-to-a-long-random-value-123456789
app.jwt.expiration-ms=86400000

app.teacher.name=${APP_TEACHER_NAME}
app.teacher.email=${APP_TEACHER_EMAIL}
app.teacher.password=${APP_TEACHER_PASSWORD}

app.admin.name=System Admin
app.admin.email=admin@college.com
app.admin.password=${ADMIN_PASSWORD}